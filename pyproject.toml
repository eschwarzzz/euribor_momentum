[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euribor-momentum"
version = "1.0.0"
description = "ECB policy-momentum strategy on 3M Euribor futures with a macro risk-factor override: data, synthetic instrument, backtest, Monte Carlo and reports"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
render = ["markdown-it-py>=3.0"]

[tool.setuptools]
packages = ["euribor", "research"]
